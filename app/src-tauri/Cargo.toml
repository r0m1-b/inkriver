[package]
name = "reader-app"
version = "0.1.0"
description = "A unified Medium and Substack reader"
authors = ["Reader contributors"]
edition = "2024"

[lib]
name = "reader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reader = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
