[package]
name = "inkriver-app"
version = "0.3.0"
description = "InkRiver, a unified Medium and Substack reader"
authors = ["InkRiver contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "inkriver_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
inkriver = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
chrono = "0.4.45"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
