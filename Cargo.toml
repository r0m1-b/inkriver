[package]
name = "reader"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.1.3"
anyhow = "1.0.104"
chrono = "0.4.45"
feed-rs = "2.4.0"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
toml = "1.1.4"
