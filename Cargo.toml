[package]
name = "inkriver"
version = "0.3.1"
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace]
members = [".", "app/src-tauri"]
resolver = "3"

[dependencies]
ammonia = "4.1.3"
anyhow = "1.0.104"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
feed-rs = "2.4.0"
futures-util = "0.3.31"
getrandom = "0.4.3"
html2text = "0.17.1"
image = { version = "0.25.8", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
legible = "0.5.1"
quick-xml = "0.41.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = "0.13.4"
resvg = { version = "0.45.1", default-features = false }
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "time"] }
toml = "1.1.4"
uuid = { version = "1.18.1", features = ["v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"
webpki-root-certs = "1.0.9"

[dev-dependencies]
tempfile = "3.23.0"
